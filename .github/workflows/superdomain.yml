name: superdomain

on:
  push:
    branches: [main]
    paths:
      - "plugins/superdomain/**"
      - ".github/workflows/superdomain.yml"
  pull_request:
    paths:
      - "plugins/superdomain/**"
      - ".github/workflows/superdomain.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/superdomain
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 테스트
        run: python3 -m unittest discover -s tests -q
